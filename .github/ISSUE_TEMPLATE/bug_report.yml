name: Bug Report
description: Report a reproducible simulator, packaging, or docs issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal code, command, or fixture needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, JAX/JAXLIB, OS, accelerator backend, and package version.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks Run
      description: Include relevant pytest/site/build command output.
