[project]
name = "jax-evogym"
version = "0.1.0"
description = "JAX-accelerated EvoGym soft robot physics simulator with vmap batching"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "jax-evogym contributors" },
]
keywords = ["jax", "evogym", "soft-robotics", "simulation", "evolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Life",
]
dependencies = [
    "jax==0.9.0.1",
    "jaxlib==0.9.0.1",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/btgaskin/jax-evogym"
Documentation = "https://jax-evogym.pages.dev/"
Repository = "https://github.com/btgaskin/jax-evogym"
Issues = "https://github.com/btgaskin/jax-evogym/issues"
Changelog = "https://github.com/btgaskin/jax-evogym/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
evo = ["evosax>=0.1.0"]
viz = ["matplotlib>=3.0.0", "Pillow>=9.0.0"]
dev = ["build>=1.2.0", "pytest>=7.0.0"]
all = ["jax-evogym[cuda,evo,viz,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jax_evogym"]
include = [
    "src/jax_evogym/design_tool/visual_tokens.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/ROADMAP.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
